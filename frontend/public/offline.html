<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>You're offline</title>
  <style>
    :root { color-scheme: light dark; --bg: #f4f5f9; --card: #fff; --ink: #0f172a; --muted: #64748b; --line: #e2e8f0; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b0d14; --card: #151925; --ink: #f1f5f9; --muted: #94a3b8; --line: #262c3b; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card { width: 100%; max-width: 360px; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 32px 24px; }
    .icon { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 16px; display: grid; place-items: center; background: rgba(88, 71, 215, .12); color: #5847d7; }
    h1 { margin: 0 0 6px; font-size: 20px; font-weight: 650; letter-spacing: -.01em; }
    p { margin: 0 0 22px; color: var(--muted); }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 10px 22px; color: #fff; background: #5847d7; cursor: pointer; }
    button:focus-visible { outline: 3px solid rgba(88, 71, 215, .35); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.8a15 15 0 0 1 4.2-2.6M10.7 5.1A15 15 0 0 1 22 8.8M5 12.9a10 10 0 0 1 5.2-2.8M16.9 11.2A10 10 0 0 1 19 12.9M8.5 16.4a5 5 0 0 1 7 0M12 20h.01M2 2l20 20"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>Check your connection. This page will reload when you're back online.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
